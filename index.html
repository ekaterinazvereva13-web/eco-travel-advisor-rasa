<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eco-Travel Advisor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell" aria-label="Eco-Travel Advisor chatbot">
    <section class="hero">
      <p class="eyebrow">Sustainable tourism planning prototype</p>
      <h1>Eco-Travel Advisor</h1>
      <p>Plan lower-carbon trips with transparent estimates, eco-stays, local experiences and human handover.</p>
    </section>

    <section class="chat-panel" aria-live="polite">
      <div id="messages" class="messages">
        <div class="message bot">
          <strong>Eco-Travel Advisor</strong>
          <p>Hello. Tell me where you want to travel, or choose a quick action.</p>
          <div class="quick-actions">
            <button data-payload='/plan_trip'>Plan trip</button>
            <button data-payload='/ask_transport_options'>Compare transport</button>
            <button data-payload='/ask_accommodation'>Eco hotels</button>
          </div>
        </div>
      </div>

      <form id="chat-form" class="chat-form">
        <label class="sr-only" for="message-input">Message</label>
        <input id="message-input" autocomplete="off" placeholder="Type your travel request..." />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
